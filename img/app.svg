<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bcBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bcIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bcSheetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#e8eef2;stop-opacity:0.98" />
    </linearGradient>
  </defs>

  <!-- Background circle (matches ArbeitszeitCheck app icon treatment) -->
  <circle cx="64" cy="64" r="60" fill="url(#bcBgGradient)" stroke="#ffffff" stroke-width="4"/>

  <g transform="translate(22, 26)">
    <!-- Rear ledger card (depth) -->
    <rect x="8" y="6" width="76" height="70" rx="5" fill="#004d7a" opacity="0.35" stroke="none"/>

    <!-- Main budget sheet -->
    <rect x="0" y="0" width="84" height="76" rx="5" fill="url(#bcSheetGradient)" stroke="#0082c9" stroke-width="2"/>
    <path d="M0 12c0-3.3 2.7-6 6-6h72c3.3 0 6 2.7 6 6v8H0z" fill="#0082c9"/>

    <!-- Column guides -->
    <line x1="28" y1="22" x2="28" y2="76" stroke="#0082c9" stroke-width="1" opacity="0.25"/>
    <line x1="56" y1="22" x2="56" y2="76" stroke="#0082c9" stroke-width="1" opacity="0.25"/>

    <!-- Row lines (ledger) -->
    <line x1="6" y1="30" x2="78" y2="30" stroke="#0082c9" stroke-width="1" opacity="0.3"/>
    <line x1="6" y1="42" x2="78" y2="42" stroke="#0082c9" stroke-width="1" opacity="0.3"/>
    <line x1="6" y1="54" x2="78" y2="54" stroke="#0082c9" stroke-width="1" opacity="0.3"/>
    <line x1="6" y1="66" x2="78" y2="66" stroke="#0082c9" stroke-width="1" opacity="0.3"/>

    <!-- Row markers -->
    <circle cx="14" cy="33" r="2" fill="#0082c9" opacity="0.55"/>
    <circle cx="14" cy="45" r="2" fill="#0082c9" opacity="0.55"/>
    <circle cx="14" cy="57" r="2" fill="#0082c9" opacity="0.55"/>

    <!-- Mini budget bars -->
    <g transform="translate(30, 42)">
      <rect x="0" y="16" width="12" height="16" rx="2" fill="url(#bcIconGradient)" stroke="#0082c9" stroke-width="1.2"/>
      <rect x="16" y="8" width="12" height="24" rx="2" fill="url(#bcIconGradient)" stroke="#0082c9" stroke-width="1.2"/>
      <rect x="32" y="12" width="12" height="20" rx="2" fill="url(#bcIconGradient)" stroke="#0082c9" stroke-width="1.2"/>
    </g>

    <!-- Compliance check badge (same language as ArbeitszeitCheck) -->
    <g transform="translate(54, -4)">
      <path d="M8 4 C8 2, 10 0, 12 0 C14 0, 16 2, 16 4 L16 8 C16 10, 14 12, 12 12 C10 12, 8 10, 8 8 Z"
            fill="url(#bcIconGradient)" stroke="#4CAF50" stroke-width="1.5"/>
      <path d="M6 6 L9 9 L14 4" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Corner highlights -->
  <circle cx="20" cy="20" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="108" cy="20" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="20" cy="108" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="108" cy="108" r="2.5" fill="#ffffff" opacity="0.6"/>
</svg>
